name: Sharq Push Relay
on:
  workflow_dispatch:
    inputs:
      token: {description: 'FCM device token', required: true}
      title: {description: 'Title', required: true, default: 'Sharq'}
      body: {description: 'Body', required: true, default: 'Fresh job matches surfaced!'}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send FCM push
        env:
          SA_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          TOKEN: ${{ inputs.token }}
          TITLE: ${{ inputs.title }}
          BODY: ${{ inputs.body }}
        run: |
          pip install -q google-auth requests
          python3 << 'EOF'
          import json, os, requests
          from google.oauth2 import service_account
          import google.auth.transport.requests
          sa = json.loads(os.environ['SA_JSON'])
          creds = service_account.Credentials.from_service_account_info(
              sa, scopes=['https://www.googleapis.com/auth/firebase.messaging'])
          creds.refresh(google.auth.transport.requests.Request())
          url = f"https://fcm.googleapis.com/v1/projects/{sa['project_id']}/messages:send"
          payload = {"message": {"token": os.environ['TOKEN'],
              "notification": {"title": os.environ['TITLE'], "body": os.environ['BODY']},
              "webpush": {"fcm_options": {"link": "https://ejarr1998.github.io/sharq/"}}}}
          r = requests.post(url, headers={'Authorization': f'Bearer {creds.token}'}, json=payload, timeout=30)
          print(r.status_code, r.text[:500]); r.raise_for_status()
          EOF
