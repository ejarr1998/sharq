<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#04121d">
<title>Sharq — Job Hunt Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<style>
  :root {
    --bg: #04121d; --bg2: #07202f; --card: #0a2334; --border: #14394f;
    --text: #e8f4f8; --muted: #7fa3b5;
    --accent: #35b6d4; --accent-deep: #1b7f99;
    --fin: #2dd4a7; --blood: #e5604f; --gold: #f0b35e;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 60%, #041824 100%);
    background-attachment: fixed;
    color: var(--text); font-family: -apple-system,'Segoe UI',Roboto,sans-serif;
    padding-bottom: 60px; min-height: 100vh;
  }
  header {
    padding: 22px 16px 14px; position: sticky; top: 0; z-index: 10;
    background: rgba(4,18,29,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .brand { display:flex; align-items:center; gap:10px; }
  h1 { font-size: 26px; letter-spacing: 1px; font-weight: 800; }
  h1 .q { color: var(--accent); }
  .tagline { color: var(--muted); font-size: 12px; margin-top: 2px; font-style: italic; }
  #updated { color: var(--muted); font-size: 11px; margin-top: 6px; }
  #stats { display:flex; gap:16px; margin-top:12px; font-size:13px; color:var(--muted); }
  #stats b { color: var(--fin); }
  .filters { display:flex; gap:8px; padding:12px 16px; overflow-x:auto; }
  .chip {
    padding:6px 14px; border-radius:20px; border:1px solid var(--border);
    background:var(--card); color:var(--muted); font-size:13px; cursor:pointer; white-space:nowrap;
  }
  .chip.active { background:var(--accent); color:#04222e; border-color:var(--accent); font-weight:700; }
  #jobs { padding:0 16px; display:flex; flex-direction:column; gap:12px; max-width:720px; margin:0 auto; }
  .card {
    background: linear-gradient(160deg, var(--card), #081c2a);
    border:1px solid var(--border); border-radius:14px; padding:16px;
    box-shadow: 0 4px 18px rgba(0,0,0,.35);
  }
  .card.fresh { border-color: var(--fin); }
  .card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .card h2 { font-size:16px; line-height:1.3; }
  .company { color:var(--muted); font-size:13px; margin-top:2px; }
  .badge { font-size:11px; padding:3px 9px; border-radius:10px; white-space:nowrap; font-weight:700; }
  .badge.new { background:rgba(45,212,167,.12); color:var(--fin); border:1px solid var(--fin); }
  .badge.applied { background:rgba(240,179,94,.12); color:var(--gold); border:1px solid var(--gold); }
  .meta { display:flex; flex-wrap:wrap; gap:12px; margin:10px 0; font-size:13px; }
  .meta span { color:var(--muted); }
  .meta .pay { color:var(--fin); font-weight:700; }
  .fit {
    font-size:13px; color:#c3d9e3; line-height:1.55;
    border-left:3px solid var(--accent); padding-left:10px; margin:10px 0;
  }
  .actions { display:flex; gap:10px; margin-top:12px; }
  .btn {
    flex:1; text-align:center; padding:10px; border-radius:8px; font-size:14px; font-weight:700;
    text-decoration:none; cursor:pointer; border:none;
  }
  .btn-apply { background: linear-gradient(135deg, var(--accent), var(--accent-deep)); color:#fff; }
  .btn-mark { background:transparent; color:var(--muted); border:1px solid var(--border); flex:0 0 auto; padding:10px 14px; }
  #empty { text-align:center; color:var(--muted); padding:60px 20px; line-height:1.7; }
  #push-banner {
    margin:12px 16px; padding:14px 16px; max-width:688px;
    background:linear-gradient(135deg,#0a2a3d,#081c2a);
    border:1px solid var(--accent); border-radius:12px; display:none; align-items:center; gap:12px;
  }
  #push-banner p { font-size:13px; flex:1; }
  #push-banner button { background:var(--accent); color:#04222e; border:none; padding:8px 16px; border-radius:8px; font-weight:700; cursor:pointer; }
  #toast {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--fin); color:#04222e; padding:10px 20px; border-radius:8px;
    font-size:14px; font-weight:600; display:none; z-index:99;
  }
  .wave { display:block; width:100%; height:24px; margin-top:8px; opacity:.5; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <path d="M8 46 Q22 12 40 10 Q34 24 38 34 Q46 30 56 32 Q48 44 34 48 Q18 52 8 46 Z" fill="#35b6d4"/>
      <circle cx="24" cy="38" r="2.4" fill="#04121d"/>
      <path d="M4 52 Q16 46 28 52 T52 52" stroke="#2dd4a7" stroke-width="3" fill="none" stroke-linecap="round"/>
    </svg>
    <div>
      <h1>SHAR<span class="q">Q</span></h1>
      <div class="tagline">Smell opportunity in the water.</div>
    </div>
  </div>
  <div id="updated">Circling…</div>
  <div id="stats"></div>
</header>

<div id="push-banner">
  <p>Enable push notifications and Sharq will ping your phone the moment fresh matches surface.</p>
  <button id="enable-push">Enable</button>
</div>

<div class="filters">
  <div class="chip active" data-f="all">All waters</div>
  <div class="chip" data-f="ifs">IFS / MWM</div>
  <div class="chip" data-f="implementation">Implementation</div>
  <div class="chip" data-f="support">App Support</div>
  <div class="chip" data-f="ai">AI Roles</div>
  <div class="chip" data-f="new">Fresh catches</div>
</div>

<div id="jobs"></div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>
<script>
// ============ FIREBASE CONFIG ============
const firebaseConfig = {
  apiKey: "AIzaSyBJCHgFjwPgF0xGxmjkgxwnex09pwTKar8",
  authDomain: "sparq-52efd.firebaseapp.com",
  projectId: "sparq-52efd",
  storageBucket: "sparq-52efd.firebasestorage.app",
  messagingSenderId: "785016952899",
  appId: "1:785016952899:web:b51ce870f06e52b3c59cf6"
};
const VAPID_KEY = "BIFMG3wX0YVOLmFde6ckEbLfdiGhtGWICd9GLsm9UJiCQ3sUEjW52GF0FYMk17pHsc6mSlYNNx2B36pM00Ze9TQ";
// =========================================

const $ = s => document.querySelector(s);
let allJobs = [], filter = 'all';
let applied = JSON.parse(localStorage.getItem('sharq_applied') || '[]');
let seen = JSON.parse(localStorage.getItem('sharq_seen') || '[]');

async function load() {
  const res = await fetch('jobs.json?ts=' + Date.now());
  const data = await res.json();
  allJobs = data.jobs;
  $('#updated').textContent = 'Last patrol: ' + data.updated;
  render();
}

function render() {
  let list = allJobs;
  if (filter === 'new') list = list.filter(j => j.status === 'new' && !seen.includes(j.id));
  else if (filter !== 'all') list = list.filter(j => j.category === filter);

  const newCount = allJobs.filter(j => j.status === 'new' && !seen.includes(j.id)).length;
  $('#stats').innerHTML = `<span><b>${allJobs.length}</b> in the water</span><span><b>${newCount}</b> fresh</span><span><b>${applied.length}</b> caught</span>`;

  $('#jobs').innerHTML = list.length ? list.map(j => {
    const isNew = j.status === 'new' && !seen.includes(j.id);
    const hasApplied = applied.includes(j.id);
    return `<div class="card ${isNew ? 'fresh' : ''}" data-id="${j.id}">
      <div class="card-top">
        <div><h2>${j.title}</h2><div class="company">${j.company}</div></div>
        ${isNew ? '<span class="badge new">FRESH</span>' : hasApplied ? '<span class="badge applied">CAUGHT</span>' : ''}
      </div>
      <div class="meta"><span>📍 ${j.location}</span><span class="pay">${j.pay}</span><span>🗓 ${j.added}</span></div>
      <div class="fit">${j.fit}</div>
      <div class="actions">
        <a class="btn btn-apply" href="${j.link}" target="_blank" rel="noopener">Strike →</a>
        ${hasApplied ? '' : `<button class="btn btn-mark" onclick="markApplied('${j.id}')">Mark caught</button>`}
      </div>
    </div>`;
  }).join('') : '<div id="empty">Quiet waters here.<br>Fresh catches surface after the daily 2 PM patrol.</div>';

  seen = [...new Set([...seen, ...list.map(j => j.id)])];
  localStorage.setItem('sharq_seen', JSON.stringify(seen));
}

function markApplied(id) {
  applied.push(id);
  localStorage.setItem('sharq_applied', JSON.stringify(applied));
  toast('Caught — nice strike!');
  render();
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2500);
}

document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
  document.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
  c.classList.add('active');
  filter = c.dataset.f;
  render();
});

// ---------- PWA + Push ----------
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('firebase-messaging-sw.js');
}

const pushConfigured = !firebaseConfig.apiKey.includes('PASTE');
if (pushConfigured && 'Notification' in window && Notification.permission === 'default') {
  $('#push-banner').style.display = 'flex';
}

$('#enable-push').onclick = async () => {
  try {
    firebase.initializeApp(firebaseConfig);
    const messaging = firebase.messaging();
    const swReg = await navigator.serviceWorker.ready;
    const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: swReg });
    if (token) {
      $('#push-banner').style.display = 'none';
      toast('Notifications enabled!');
      prompt('Copy this token and send it to Kimi (one time only):', token);
    }
  } catch (e) { toast('Push setup failed: ' + e.message); }
};

load();
</script>
</body>
</html>
