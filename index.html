<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#b6b7bf">
<title>Sharq — Job Hunt Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root {
    --steel: #b6b7bf;
    --steel-hi: #d9dade;
    --paper: #f2f2f4;
    --ink: #0b0b10;
    --ink-soft: #4a4a55;
    --volt: #0019e3;
    --volt-deep: #0012a8;
    --gold: #c98a12;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--steel);
    color: var(--ink);
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    letter-spacing: -0.01em;
    padding-bottom: 92px;
    min-height: 100vh;
  }
  ::selection { background: var(--volt); color: #fff; }

  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--steel);
    border-bottom: 2px solid var(--ink);
    padding: 16px 16px 12px;
  }
  .brand { display:flex; align-items:center; gap:12px; }
  .brand img { flex: 0 0 auto; }
  h1 {
    font-size: 30px; font-weight: 900; letter-spacing: 0.04em;
    text-transform: uppercase; line-height: 1;
    font-family: 'Arial Narrow', -apple-system, Arial, sans-serif;
    font-stretch: condensed;
  }
  h1 .q { color: var(--volt); }
  .tagline {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.12em; color: var(--ink-soft); margin-top: 3px;
  }
  #updated {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--ink-soft); margin-top: 8px;
  }
  #stats { display:flex; gap:0; margin-top:10px; border: 2px solid var(--ink); background: var(--paper); }
  #stats .stat {
    flex:1; padding: 8px 10px; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft);
    border-right: 2px solid var(--ink);
  }
  #stats .stat:last-child { border-right: none; }
  #stats .stat b { display:block; font-size: 20px; color: var(--ink); letter-spacing: 0; }
  #stats .stat.hot b { color: var(--volt); }

  .filters {
    display:flex; gap:8px; padding:12px 16px; overflow-x:auto;
    scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .filters.hidden { display:none; }
  .chip {
    padding: 7px 14px; border: 2px solid var(--ink); background: var(--paper);
    color: var(--ink); font-size: 11px; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.08em; cursor: pointer; white-space: nowrap; border-radius: 0;
  }
  .chip.active { background: var(--volt); color: #fff; border-color: var(--volt); box-shadow: 3px 3px 0 var(--ink); }

  #jobs { padding: 2px 16px 0; display:flex; flex-direction:column; gap:16px; max-width: 720px; margin: 0 auto; }
  .card {
    background: var(--paper);
    border: 2px solid var(--ink);
    box-shadow: 5px 5px 0 var(--ink);
    padding: 16px;
  }
  .card.fresh { box-shadow: 5px 5px 0 var(--volt); }
  .card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .card h2 {
    font-size: 18px; font-weight: 900; text-transform: uppercase;
    letter-spacing: 0.01em; line-height: 1.15;
    font-family: 'Arial Narrow', -apple-system, Arial, sans-serif;
  }
  .company {
    font-size: 12px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--ink-soft); margin-top: 3px;
  }
  .badge {
    font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em;
    padding: 4px 8px; white-space: nowrap; border: 2px solid var(--ink);
  }
  .badge.new { background: var(--volt); color: #fff; border-color: var(--volt); }
  .badge.applied { background: var(--ink); color: var(--gold); }
  .badge.dead { background: var(--steel); color: var(--ink-soft); }

  .meta {
    display:flex; flex-wrap:wrap; gap: 6px 14px; margin: 12px 0 0;
    padding-top: 10px; border-top: 2px solid var(--ink);
    font-size: 12px; font-weight: 600; color: var(--ink-soft);
  }
  .meta .pay { color: var(--volt); font-weight: 800; }

  .fit {
    font-size: 14px; line-height: 1.5; color: var(--ink);
    margin: 12px 0 0; padding: 10px 12px;
    background: var(--steel-hi);
    border-left: 4px solid var(--volt);
  }

  .actions { display:flex; gap:10px; margin-top:14px; }
  .btn {
    flex:1; text-align:center; padding: 11px; font-size: 12px; font-weight: 900;
    text-transform: uppercase; letter-spacing: 0.1em;
    text-decoration:none; cursor:pointer;
    border: 2px solid var(--ink); border-radius: 0;
    background: var(--paper); color: var(--ink);
  }
  .btn:active { transform: translate(2px, 2px); }
  .btn-apply { background: var(--volt); color: #fff; border-color: var(--volt); box-shadow: 3px 3px 0 var(--ink); }
  .btn-apply:active { box-shadow: 1px 1px 0 var(--ink); }
  .btn-mark { flex: 0 0 auto; padding: 11px 14px; box-shadow: 3px 3px 0 var(--ink); }
  .btn-dismiss { flex: 0 0 auto; padding: 11px 13px; color: var(--ink-soft); }
  .btn-dismiss:hover { color: #fff; background: var(--ink); }
  .btn-restore { flex: 0 0 auto; padding: 11px 14px; color: var(--volt); border-color: var(--volt); }
  #clear-bar {
    background: var(--ink); color: var(--paper); border: 2px solid var(--ink);
    box-shadow: 5px 5px 0 var(--steel);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 16px;
  }
  #clear-bar span { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; }
  #auth-area { margin-top: 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  #auth-who { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); }
  #btn-auth {
    border: 2px solid var(--ink); background: var(--paper); color: var(--ink);
    padding: 7px 14px; font-size: 10px; font-weight: 900; text-transform: uppercase;
    letter-spacing: 0.1em; cursor: pointer; border-radius: 0; white-space: nowrap;
  }
  #btn-auth:hover { background: var(--volt); color: #fff; border-color: var(--volt); }
  #clear-bar button {
    background: var(--paper); color: var(--ink); border: 2px solid var(--paper);
    padding: 9px 16px; font-weight: 900; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.1em; cursor: pointer; border-radius: 0; white-space: nowrap;
  }

  #empty {
    text-align:center; color: var(--ink-soft); padding: 60px 20px; line-height: 1.8;
    font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
  }

  #push-banner {
    margin: 12px 16px; max-width: 688px;
    background: var(--ink); color: var(--paper);
    border: 2px solid var(--ink); box-shadow: 5px 5px 0 var(--volt);
    display: none; align-items: center; gap: 12px; padding: 14px 16px;
  }
  #push-banner p { font-size: 13px; flex: 1; line-height: 1.4; }
  #push-banner button {
    background: var(--volt); color: #fff; border: 2px solid var(--volt);
    padding: 9px 16px; font-weight: 900; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.1em; cursor: pointer; border-radius: 0;
  }

  #toast {
    position: fixed; bottom: 104px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--paper);
    border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--volt);
    padding: 10px 18px; font-size: 12px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.08em;
    display: none; z-index: 99; white-space: nowrap;
  }

  #tabs {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
    display: flex; background: var(--paper);
    border-top: 2px solid var(--ink);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tab {
    flex: 1; text-align: center; padding: 10px 4px 8px; cursor: pointer;
    color: var(--ink-soft); font-size: 10px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.1em;
    border-right: 2px solid var(--ink);
  }
  .tab:last-child { border-right: none; }
  .tab .ico { font-size: 19px; display: block; margin-bottom: 3px; filter: grayscale(1); }
  .tab .count {
    display: inline-block; min-width: 18px; padding: 1px 5px; margin-left: 4px;
    background: var(--steel); color: var(--ink); font-size: 10px; font-weight: 900;
    border: 1.5px solid var(--ink);
  }
  .tab.active { color: var(--volt); background: var(--steel-hi); }
  .tab.active .ico { filter: none; }
  .tab.active .count { background: var(--volt); color: #fff; border-color: var(--volt); }
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="icons/logo.png" alt="Sharq logo" style="width:64px; height:auto; display:block;">
    <div>
      <h1>Shar<span class="q">q</span></h1>
      <div class="tagline">Smell opportunity in the water</div>
    </div>
  </div>
  <div id="updated">Circling…</div>
  <div id="stats"></div>
  <div id="auth-area"></div>
</header>

<div id="push-banner">
  <p>Enable push notifications and Sharq will ping your phone the moment fresh matches surface.</p>
  <button id="enable-push">Enable</button>
</div>



<div class="filters" id="filters">
  <div class="chip active" data-f="all">All waters</div>
  <div class="chip" data-f="ifs">IFS / MWM</div>
  <div class="chip" data-f="implementation">Implementation</div>
  <div class="chip" data-f="support">App Support</div>
  <div class="chip" data-f="ai">AI Roles</div>
  <div class="chip" data-f="new">Fresh catches</div>
</div>

<div id="jobs"></div>

<div id="tabs">
  <div class="tab active" data-tab="hunt"><span class="ico">🦈</span>Hunt<span class="count" id="c-hunt">0</span></div>
  <div class="tab" data-tab="caught"><span class="ico">🎣</span>Caught<span class="count" id="c-caught">0</span></div>
  <div class="tab" data-tab="dismissed"><span class="ico">🌊</span>Released<span class="count" id="c-dismissed">0</span></div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
// ============ FIREBASE CONFIG ============
const firebaseConfig = {
  apiKey: "AIzaSyBJCHgFjwPgF0xGxmjkgxwnex09pwTKar8",
  authDomain: "sparq-52efd.firebaseapp.com",
  projectId: "sparq-52efd",
  storageBucket: "sparq-52efd.firebasestorage.app",
  messagingSenderId: "785016952899",
  appId: "1:785016952899:web:b51ce870f06e52b3c59cf6"
};
const VAPID_KEY = "BIFMG3wX0YVOLmFde6ckEbLfdiGhtGWICd9GLsm9UJiCQ3sUEjW52GF0FYMk17pHsc6mSlYNNx2B36pM00Ze9TQ";
// =========================================

const $ = s => document.querySelector(s);
let allJobs = [], filter = 'all', tab = 'hunt';
let applied = JSON.parse(localStorage.getItem('sharq_applied') || '{}');
let dismissed = JSON.parse(localStorage.getItem('sharq_dismissed') || '[]');
let seen = JSON.parse(localStorage.getItem('sharq_seen') || '[]');
let deleted = JSON.parse(localStorage.getItem('sharq_deleted') || '[]');

if (Array.isArray(applied)) {
  const o = {}; applied.forEach(id => o[id] = 'earlier'); applied = o;
}

let user = null, db = null, applyingRemote = false, authChecked = false;

function save() {
  localStorage.setItem('sharq_applied', JSON.stringify(applied));
  localStorage.setItem('sharq_dismissed', JSON.stringify(dismissed));
  localStorage.setItem('sharq_seen', JSON.stringify(seen));
  localStorage.setItem('sharq_deleted', JSON.stringify(deleted));
  if (user && db && !applyingRemote) {
    db.collection('users').doc(user.uid).set({
      applied: applied, dismissed: dismissed, seen: seen, deleted: deleted,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true }).catch(e => console.warn('Firestore sync failed', e));
  }
}

async function load() {
  try {
    const res = await fetch('jobs.json?ts=' + Date.now());
    const data = await res.json();
    allJobs = (data.jobs || []).filter(j => !deleted.includes(j.id));
    $('#updated').textContent = 'Last patrol — ' + data.updated;
  } catch (e) {
    $('#updated').textContent = 'LOAD ERROR: ' + e.message;
  }
  render();
}


function cardHtml(j, mode) {
  const isNew = j.status === 'new' && !seen.includes(j.id);
  const badge = mode === 'caught' ? '<span class="badge applied">Caught</span>'
              : mode === 'dismissed' ? '<span class="badge dead">Released</span>'
              : isNew ? '<span class="badge new">Fresh</span>' : '';
  let actions = '';
  if (mode === 'hunt') {
    actions = `<a class="btn btn-apply" href="${j.link}" target="_blank" rel="noopener">Strike →</a>
      <button class="btn btn-mark" onclick="markCaught('${j.id}')">Mark caught</button>
      <button class="btn btn-dismiss" onclick="dismiss('${j.id}')" title="Not interested">✕</button>`;
  } else if (mode === 'caught') {
    actions = `<a class="btn btn-apply" href="${j.link}" target="_blank" rel="noopener">View posting →</a>
      <button class="btn btn-restore" onclick="restore('${j.id}')">Back to hunt</button>`;
  } else {
    actions = `<button class="btn btn-restore" style="flex:1" onclick="restore('${j.id}')">Throw back in the water</button>
      <button class="btn btn-dismiss" onclick="deleteForever('${j.id}')" title="Delete permanently">🗑</button>`;
  }
  const caughtLine = mode === 'caught' ? `<span>Caught ${applied[j.id] || ''}</span>` : '';
  return `<div class="card ${mode === 'hunt' && isNew ? 'fresh' : ''}">
    <div class="card-top">
      <div><h2>${j.title}</h2><div class="company">${j.company}</div></div>
      ${badge}
    </div>
    <div class="meta"><span>📍 ${j.location}</span><span class="pay">${j.pay}</span><span>Added ${j.added}</span>${caughtLine}</div>
    <div class="fit">${j.fit}</div>
    <div class="actions">${actions}</div>
  </div>`;
}

function render() {
  const hunting = allJobs.filter(j => !(j.id in applied) && !dismissed.includes(j.id));
  const caught = allJobs.filter(j => j.id in applied);
  const released = allJobs.filter(j => dismissed.includes(j.id));

  $('#c-hunt').textContent = hunting.length;
  $('#c-caught').textContent = caught.length;
  $('#c-dismissed').textContent = released.length;

  const newCount = hunting.filter(j => j.status === 'new' && !seen.includes(j.id)).length;
  $('#stats').innerHTML =
    `<div class="stat"><b>${allJobs.length}</b>In water</div>` +
    `<div class="stat hot"><b>${newCount}</b>Fresh</div>` +
    `<div class="stat"><b>${caught.length}</b>Caught</div>`;

  $('#filters').classList.toggle('hidden', tab !== 'hunt' || !user);

  if (!authChecked) {
    $('#jobs').innerHTML = '<div id="empty">Checking sign-in…</div>';
    return;
  }
  if (!user) {
    $('#c-hunt').textContent = 0;
    $('#c-caught').textContent = 0;
    $('#c-dismissed').textContent = 0;
    $('#jobs').innerHTML = '<div id="empty">These waters are private.<br>Sign in with Google above to see your hunt.</div>';
    return;
  }

  let html = '';
  if (tab === 'hunt') {
    let list = hunting;
    if (filter === 'new') list = list.filter(j => j.status === 'new' && !seen.includes(j.id));
    else if (filter !== 'all') list = list.filter(j => j.category === filter);
    html = list.length ? list.map(j => cardHtml(j, 'hunt')).join('')
      : '<div id="empty">Quiet waters here.<br>Fresh catches surface after the daily 2 PM patrol.</div>';
    seen = [...new Set([...seen, ...list.map(j => j.id)])];
  } else if (tab === 'caught') {
    html = caught.length ? caught.map(j => cardHtml(j, 'caught')).join('')
      : '<div id="empty">Nothing caught yet.<br>Hit a posting, apply, then tap Mark caught.</div>';
  } else {
    html = released.length
      ? `<div id="clear-bar"><span>${released.length} release${released.length === 1 ? '' : 's'} in the bin</span><button onclick="clearReleased()">Clear all 🗑</button></div>`
        + released.map(j => cardHtml(j, 'dismissed')).join('')
      : '<div id="empty">No releases.<br>Jobs you dismiss with ✕ wash up here.</div>';
  }
  $('#jobs').innerHTML = html;
  save();
}

function markCaught(id) {
  applied[id] = new Date().toISOString().slice(0, 10);
  toast('Caught — nice strike!');
  render();
}
function dismiss(id) {
  dismissed.push(id);
  toast('Released back into the water');
  render();
}
function deleteForever(id) {
  if (!confirm('Delete this posting permanently? It will not come back, even in Released.')) return;
  dismissed = dismissed.filter(x => x !== id);
  deleted.push(id);
  localStorage.setItem('sharq_deleted', JSON.stringify(deleted));
  toast('Deleted for good');
  render();
}
function clearReleased() {
  if (!dismissed.length) return;
  if (!confirm('Clear the entire Released bin? All ' + dismissed.length + ' posting(s) will be permanently deleted and will not come back.')) return;
  deleted = [...new Set([...deleted, ...dismissed])];
  allJobs = allJobs.filter(j => !dismissed.includes(j.id));
  dismissed = [];
  localStorage.setItem('sharq_deleted', JSON.stringify(deleted));
  toast('Released bin cleared');
  render();
}
function restore(id) {
  delete applied[id];
  dismissed = dismissed.filter(x => x !== id);
  toast('Back in the hunt');
  render();
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2500);
}

document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
  document.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
  c.classList.add('active');
  filter = c.dataset.f;
  render();
});

document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  tab = t.dataset.tab;
  render();
});

// ---------- PWA + Push ----------
let swReg = null;
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('firebase-messaging-sw.js').then(reg => {
    swReg = reg;
    reg.update(); // check for a new version right away
  });
  // when a new service worker takes control, reload to get the fresh app
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshing) return;
    refreshing = true;
    location.reload();
  });
  // check for updates every time you come back to the app
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && swReg) swReg.update();
  });
}

async function fetchAndShowToken() {
  try {
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const messaging = firebase.messaging();
    const reg = swReg || await navigator.serviceWorker.ready;
    const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
    if (token) {
      $('#push-banner').style.display = 'none';
      toast('Notifications enabled!');
    }
  } catch (e) {
    toast('Notifications unavailable on this device');
  }
}

function maybeShowPushBanner() {
  const ok = 'Notification' in window && 'serviceWorker' in navigator && 'PushManager' in window;
  if (!ok) return;
  if (Notification.permission === 'default') {
    $('#push-banner').style.display = 'flex';
  } else if (Notification.permission === 'granted') {
    // already allowed earlier — just fetch and show the token
    fetchAndShowToken();
  }
}
maybeShowPushBanner();

$('#enable-push').onclick = fetchAndShowToken;

// ---------- Auth + Firestore sync ----------
function esc(s) { return String(s).replace(/[<>&"']/g, ''); }

function renderAuth() {
  const el = $('#auth-area');
  if (user) {
    const name = esc((user.displayName || user.email || 'you').split(' ')[0]);
    el.innerHTML = '<span id="auth-who">Signed in as ' + name + ' — devices synced</span><button id="btn-auth">Sign out</button>';
    $('#btn-auth').onclick = () => firebase.auth().signOut();
  } else {
    el.innerHTML = '<span id="auth-who">Local only — sign in to sync your devices</span><button id="btn-auth">Sign in with Google</button>';
    $('#btn-auth').onclick = () => firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider())
      .catch(e => toast('Sign-in failed: ' + esc(e.code || 'unknown')));
  }
}

function initAuth() {
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  firebase.auth().onAuthStateChanged(async u => {
    user = u;
    renderAuth();
    authChecked = true;
    render();
    if (!u) return;
    const ref = db.collection('users').doc(u.uid);
    try {
      const snap = await ref.get();
      if (snap.exists) {
        const r = snap.data();
        applied = Object.assign({}, r.applied || {}, applied);
        dismissed = [...new Set([...(r.dismissed || []), ...dismissed])];
        deleted = [...new Set([...(r.deleted || []), ...deleted])];
        seen = [...new Set([...(r.seen || []), ...seen])];
        save();
        load();
        toast('Synced across your devices');
      } else {
        save();
        toast('Account linked — state uploaded');
      }
      ref.onSnapshot(s => {
        if (!s.exists || !user) return;
        const r = s.data();
        const same = JSON.stringify(r.applied || {}) === JSON.stringify(applied)
          && JSON.stringify(r.dismissed || []) === JSON.stringify(dismissed)
          && JSON.stringify(r.deleted || []) === JSON.stringify(deleted)
          && JSON.stringify(r.seen || []) === JSON.stringify(seen);
        if (same) return;
        applyingRemote = true;
        applied = r.applied || {};
        dismissed = r.dismissed || [];
        deleted = r.deleted || [];
        seen = r.seen || [];
        allJobs = allJobs.filter(j => !deleted.includes(j.id));
        save();
        applyingRemote = false;
        render();
      }, e => console.warn('sync listener error', e));
    } catch (e) {
      console.warn('Firestore unavailable, staying local', e);
      toast('Sync unavailable — using local storage');
    }
  });
}
initAuth();
renderAuth();

load();
</script>
</body>
</html>
