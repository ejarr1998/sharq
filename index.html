<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#b6b7bf">
<title>Sharq — Job Hunt Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root {
    --steel: #b6b7bf;
    --steel-hi: #d9dade;
    --paper: #f2f2f4;
    --ink: #0b0b10;
    --ink-soft: #4a4a55;
    --volt: #0019e3;
    --volt-deep: #0012a8;
    --gold: #c98a12;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--steel);
    color: var(--ink);
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    letter-spacing: -0.01em;
    padding-bottom: 92px;
    min-height: 100vh;
  }
  ::selection { background: var(--volt); color: #fff; }

  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--steel);
    border-bottom: 2px solid var(--ink);
    padding: 16px 16px 12px;
  }
  .brand { display:flex; align-items:center; gap:12px; }
  .brand img { flex: 0 0 auto; }
  h1 {
    font-size: 30px; font-weight: 900; letter-spacing: 0.04em;
    text-transform: uppercase; line-height: 1;
    font-family: 'Arial Narrow', -apple-system, Arial, sans-serif;
    font-stretch: condensed;
  }
  h1 .q { color: var(--volt); }
  .tagline {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.12em; color: var(--ink-soft); margin-top: 3px;
  }
  #updated {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--ink-soft); margin-top: 8px;
  }


  #jobs { padding: 2px 16px 0; display:flex; flex-direction:column; gap:16px; max-width: 720px; margin: 0 auto; }
  .card {
    background: var(--paper);
    border: 2px solid var(--ink);
    box-shadow: 5px 5px 0 var(--ink);
    padding: 16px;
  }
  .card.fresh { box-shadow: 5px 5px 0 var(--volt); }
  .card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .card h2 {
    font-size: 18px; font-weight: 900; text-transform: uppercase;
    letter-spacing: 0.01em; line-height: 1.15;
    font-family: 'Arial Narrow', -apple-system, Arial, sans-serif;
  }
  .company {
    font-size: 12px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--ink-soft); margin-top: 3px;
  }
  .badge {
    font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em;
    padding: 4px 8px; white-space: nowrap; border: 2px solid var(--ink);
  }
  .badge.new { background: var(--volt); color: #fff; border-color: var(--volt); }
  .grade {
    font-size: 12px; font-weight: 900; letter-spacing: 0.04em;
    padding: 4px 8px; white-space: nowrap; border: 2px solid var(--ink);
    font-family: 'Arial Narrow', -apple-system, Arial, sans-serif;
  }
  .grade.g-a { background: var(--volt); color: #fff; border-color: var(--volt); }
  .grade.g-b { background: var(--ink); color: var(--gold); }
  .grade.g-c { background: var(--steel); color: var(--ink-soft); }
  .badges { display: flex; gap: 6px; align-items: flex-start; flex: 0 0 auto; }
  .badge.applied { background: var(--ink); color: var(--gold); }
  .badge.dead { background: var(--steel); color: var(--ink-soft); }

  .meta {
    display:flex; flex-wrap:wrap; gap: 6px 14px; margin: 12px 0 0;
    padding-top: 10px; border-top: 2px solid var(--ink);
    font-size: 12px; font-weight: 600; color: var(--ink-soft);
  }
  .meta .pay { color: var(--volt); font-weight: 800; }

  .fit {
    font-size: 14px; line-height: 1.5; color: var(--ink);
    margin: 12px 0 0; padding: 10px 12px;
    background: var(--steel-hi);
    border-left: 4px solid var(--volt);
  }

  .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
  .btn {
    flex:1 1 30%; min-width: 110px; text-align:center; padding: 11px; font-size: 12px; font-weight: 900;
    text-transform: uppercase; letter-spacing: 0.1em;
    text-decoration:none; cursor:pointer;
    border: 2px solid var(--ink); border-radius: 0;
    background: var(--paper); color: var(--ink);
    transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.08s ease;
  }
  .btn:hover {
    transform: translate(-2px, -2px);
    box-shadow: 4px 4px 0 var(--volt);
  }
  .btn:active { transform: translate(0, 0); box-shadow: 1px 1px 0 var(--volt); }
  .btn:active { transform: translate(2px, 2px); }
  .btn-apply { background: var(--volt); color: #fff; border-color: var(--volt); box-shadow: 3px 3px 0 var(--ink); }
  .btn-apply:active { box-shadow: 1px 1px 0 var(--ink); }
  .btn-mark { flex: 0 0 auto; padding: 11px 14px; box-shadow: 3px 3px 0 var(--ink); }
  .btn-dismiss { flex: 0 0 auto; padding: 11px 13px; color: var(--ink-soft); }
  .btn-dismiss:hover { color: #fff; background: var(--ink); }
  .btn-restore { flex: 0 0 auto; padding: 11px 14px; color: var(--volt); border-color: var(--volt); }
  #clear-bar {
    background: var(--ink); color: var(--paper); border: 2px solid var(--ink);
    box-shadow: 5px 5px 0 var(--steel);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 16px;
  }
  #clear-bar span { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; }
  header { position: relative; }
  #btn-account {
    margin-left: auto; flex: 0 0 auto; align-self: flex-start;
    width: 38px; height: 38px;
    border: 2px solid var(--ink); background: var(--paper); color: var(--ink);
    font-size: 17px; cursor: pointer; border-radius: 0; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; padding: 0;
  }
  #btn-account img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #btn-account.signed { border-color: var(--volt); box-shadow: 2px 2px 0 var(--volt); }
  #btn-account .initial {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    background: var(--volt); color: #fff; font-size: 17px; font-weight: 900;
    font-family: 'Arial Narrow', -apple-system, Arial, sans-serif;
  }
  #account-panel {
    position: absolute; top: 88px; right: 16px; z-index: 70; width: 240px;
    background: var(--paper); border: 2px solid var(--ink); box-shadow: 5px 5px 0 var(--ink);
    padding: 14px; display: none;
  }
  #account-panel.open { display: block; }
  #acct-who { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); line-height: 1.5; margin-bottom: 10px; }
  #btn-auth {
    width: 100%; border: 2px solid var(--ink); background: var(--paper); color: var(--ink);
    padding: 9px 14px; font-size: 10px; font-weight: 900; text-transform: uppercase;
    letter-spacing: 0.1em; cursor: pointer; border-radius: 0;
  }
  #btn-auth:hover { background: var(--volt); color: #fff; border-color: var(--volt); }
  #acct-push-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-top: 12px; padding-top: 12px; border-top: 2px solid var(--ink);
  }
  #acct-push-row span { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; }
  #btn-push-toggle {
    border: 2px solid var(--ink); background: var(--steel); color: var(--ink-soft);
    padding: 6px 12px; font-size: 10px; font-weight: 900; letter-spacing: 0.1em;
    cursor: pointer; border-radius: 0; min-width: 64px;
  }
  #btn-push-toggle.on { background: var(--volt); color: #fff; border-color: var(--volt); }
  #clear-bar button {
    background: var(--paper); color: var(--ink); border: 2px solid var(--paper);
    padding: 9px 16px; font-weight: 900; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.1em; cursor: pointer; border-radius: 0; white-space: nowrap;
  }

  #empty {
    text-align:center; color: var(--ink-soft); padding: 60px 20px; line-height: 1.8;
    font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
  }

  #push-banner {
    margin: 12px 16px; max-width: 688px;
    background: var(--ink); color: var(--paper);
    border: 2px solid var(--ink); box-shadow: 5px 5px 0 var(--volt);
    display: none; align-items: center; gap: 12px; padding: 14px 16px;
  }
  #push-banner p { font-size: 13px; flex: 1; line-height: 1.4; }
  #push-banner button {
    background: var(--volt); color: #fff; border: 2px solid var(--volt);
    padding: 9px 16px; font-weight: 900; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.1em; cursor: pointer; border-radius: 0;
  }

  #toast {
    position: fixed; bottom: 104px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--paper);
    border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--volt);
    padding: 10px 18px; font-size: 12px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.08em;
    display: none; z-index: 99; white-space: nowrap;
  }

  #tabs {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
    display: flex; background: var(--paper);
    border-top: 2px solid var(--ink);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tab {
    flex: 1; text-align: center; padding: 10px 4px 8px; cursor: pointer;
    color: var(--ink-soft); font-size: 10px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.1em;
    border-right: 2px solid var(--ink);
  }
  .tab:last-child { border-right: none; }
  .tab .ico { font-size: 19px; display: block; margin-bottom: 3px; filter: grayscale(1); }
  .tab .count {
    display: inline-block; min-width: 18px; padding: 1px 5px; margin-left: 4px;
    background: var(--steel); color: var(--ink); font-size: 10px; font-weight: 900;
    border: 1.5px solid var(--ink);
  }
  .tab.active { color: var(--volt); background: var(--steel-hi); }
  .tab.active .ico { filter: none; }
  .tab.active .count { background: var(--volt); color: #fff; border-color: var(--volt); }

  /* ---------- Desktop / PC layout ---------- */
  @media (min-width: 900px) {
    header { padding: 22px 32px 16px; }
    .brand, #updated, #ver { max-width: 1100px; margin-left: auto; margin-right: auto; }
    .brand img { width: 84px !important; }
    h1 { font-size: 40px; }
    .tagline { font-size: 13px; }
    #updated { font-size: 11px; }

    /* cards in a two-column grid */
    #jobs {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 20px; max-width: 1100px; padding: 6px 32px 0;
      align-items: start;
    }
    #jobs > #empty, #jobs > #clear-bar { grid-column: 1 / -1; }
    .card h2 { font-size: 19px; }
    .card { transition: transform 0.08s ease, box-shadow 0.08s ease; }
    .card:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--volt); }

    /* tab bar becomes a centered dock */
    #tabs {
      left: 50%; right: auto; transform: translateX(-50%);
      bottom: 16px; width: min(720px, calc(100% - 32px));
      border: 2px solid var(--ink); box-shadow: 5px 5px 0 var(--ink);
    }
    .tab { padding: 12px 8px 10px; font-size: 11px; }
    body { padding-bottom: 96px; }
  }
  @media (min-width: 1400px) {
    #jobs { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="icons/logo.png" alt="Sharq logo" style="width:64px; height:auto; display:block;">
    <div>
      <h1>Shar<span class="q">q</span></h1>
      <div class="tagline">Smell opportunity in the water</div>
    </div>
    <button id="btn-account" aria-label="Account options">&#128100;</button>
  </div>
  <div id="updated">Circling…</div>
  <div id="ver" style="font-size:10px;letter-spacing:2px;color:#8a8a95;margin-top:2px;">APP v39</div>
  <div id="account-panel">
    <div id="acct-who">Not signed in</div>
    <button id="btn-auth">Sign in with Google</button>
    <div id="acct-push-row"><span>Push alerts</span><button id="btn-push-toggle">ON</button></div>
  </div>
</header>







<div id="jobs"></div>

<div id="tabs">
  <div class="tab active" data-tab="hunt"><span class="ico">🦈</span>Hunt<span class="count" id="c-hunt">0</span></div>
  <div class="tab" data-tab="caught"><span class="ico">🎣</span>Caught<span class="count" id="c-caught">0</span></div>
  <div class="tab" data-tab="interview"><span class="ico">📞</span>Interview<span class="count" id="c-interview">0</span></div>
  <div class="tab" data-tab="dismissed"><span class="ico">🌊</span>Released<span class="count" id="c-dismissed">0</span></div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
// ============ FIREBASE CONFIG ============
const firebaseConfig = {
  apiKey: "AIzaSyBJCHgFjwPgF0xGxmjkgxwnex09pwTKar8",
  authDomain: "sparq-52efd.firebaseapp.com",
  projectId: "sparq-52efd",
  storageBucket: "sparq-52efd.firebasestorage.app",
  messagingSenderId: "785016952899",
  appId: "1:785016952899:web:b51ce870f06e52b3c59cf6"
};
const VAPID_KEY = "BIFMG3wX0YVOLmFde6ckEbLfdiGhtGWICd9GLsm9UJiCQ3sUEjW52GF0FYMk17pHsc6mSlYNNx2B36pM00Ze9TQ";
// =========================================

const $ = s => document.querySelector(s);
let allJobs = [], tab = 'hunt';
let applied = JSON.parse(localStorage.getItem('sharq_applied') || '{}');
let interview = JSON.parse(localStorage.getItem('sharq_interview') || '{}');
let dismissed = JSON.parse(localStorage.getItem('sharq_dismissed') || '[]');
let seen = JSON.parse(localStorage.getItem('sharq_seen') || '[]');
let deleted = JSON.parse(localStorage.getItem('sharq_deleted') || '[]');
// tombstones: ids deliberately removed from applied/interview, with timestamps.
// A stale signed-in device can re-push old ids to the cloud; tombstones make
// removals stick through every merge and snapshot.
let removed = JSON.parse(localStorage.getItem('sharq_removed') || '{}');
let removedI = JSON.parse(localStorage.getItem('sharq_removedI') || '{}');

// Defensive normalization: a bad write once left `applied` stored as an ARRAY
// in Firestore. Arrays break `id in applied` semantics and Object.assign merges,
// which silently blocked "Back to hunt". Coerce everything back to sane shapes.
function asMap(v) {
  if (!v) return {};
  if (Array.isArray(v)) { const o = {}; v.forEach(id => { if (typeof id === 'string') o[id] = 'earlier'; }); return o; }
  if (typeof v === 'object') return v;
  return {};
}
function asList(v) {
  if (!v) return [];
  return (Array.isArray(v) ? v : [v]).flat().filter(x => typeof x === 'string');
}
function normalizeState() {
  applied = asMap(applied);
  interview = asMap(interview);
  dismissed = asList(dismissed);
  seen = asList(seen);
  deleted = asList(deleted);
  removed = asMap(removed);
  removedI = asMap(removedI);
  // prune tombstones older than 30 days
  const cutoff = Date.now() - 30 * 86400000;
  for (const m of [removed, removedI]) {
    for (const id in m) { const t = Date.parse(m[id]); if (!t || t < cutoff) delete m[id]; }
  }
}
normalizeState();
// tombstone-aware map helpers
function withoutTombstones(m, tomb) { const o = Object.assign({}, asMap(m)); for (const id in tomb) delete o[id]; return o; }
function unionTombstones(a, b) {
  const out = Object.assign({}, asMap(a));
  for (const id in asMap(b)) { if (!out[id] || String(b[id]) > String(out[id])) out[id] = b[id]; }
  return out;
}

let user = null, db = null, applyingRemote = false, authChecked = false, stateReady = false, lastJobsUpdated = '';

function persistLocal() {
  localStorage.setItem('sharq_applied', JSON.stringify(applied));
  localStorage.setItem('sharq_interview', JSON.stringify(interview));
  localStorage.setItem('sharq_dismissed', JSON.stringify(dismissed));
  localStorage.setItem('sharq_seen', JSON.stringify(seen));
  localStorage.setItem('sharq_deleted', JSON.stringify(deleted));
  localStorage.setItem('sharq_removed', JSON.stringify(removed));
  localStorage.setItem('sharq_removedI', JSON.stringify(removedI));
}

function save() {
  persistLocal();
  // never push before the initial cloud merge has run — an early push of empty
  // local arrays would wipe the account's real state (Firestore replaces arrays whole)
  if (user && db && stateReady && !applyingRemote) {
    db.collection('users').doc(user.uid).set({
      applied: applied, interview: interview, dismissed: dismissed, seen: seen, deleted: deleted,
      removed: removed, removedI: removedI,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true }).catch(e => console.warn('Firestore sync failed', e));
  }
}


let loadSeq = 0;
async function load() {
  const mySeq = ++loadSeq;  // only the most recent call may touch the screen
  try {
    if (user) {
      // per-account patrol file (Firestore fields written server-side proved
      // unreliable to read back from some devices; the file channel is solid)
      const res = await fetch('jobs-' + user.uid + '.json?ts=' + Date.now());
      if (mySeq !== loadSeq) return;
      if (res.ok) {
        const parsed = await res.json();
        allJobs = (parsed.jobs || []).filter(j => !deleted.includes(j.id));
        lastJobsUpdated = parsed.updated || '';
        $('#updated').textContent = 'Last patrol — ' + lastJobsUpdated;
      } else {
        allJobs = [];
        $('#updated').textContent = 'No patrol has run for your account yet';
      }
      render();
      return;
    }
    // signed out: shared file only feeds the date line behind the sign-in gate
    const res = await fetch('jobs.json?ts=' + Date.now());
    if (mySeq !== loadSeq) return;
    const data = await res.json();
    allJobs = [];
    $('#updated').textContent = 'Last patrol — ' + data.updated;
  } catch (e) {
    if (mySeq !== loadSeq) return;
    $('#updated').textContent = 'LOAD ERROR: ' + e.message;
  }
  render();
}


function gradeChip(j) {
  if (typeof j.score !== 'number') return '';
  const s = j.score;
  const g = s >= 90 ? 'A' : s >= 85 ? 'A-' : s >= 78 ? 'B+' : s >= 72 ? 'B' : s >= 65 ? 'B-' : s >= 58 ? 'C' : 'C-';
  const cls = s >= 85 ? 'g-a' : s >= 65 ? 'g-b' : 'g-c';
  return '<span class="grade ' + cls + '" title="Patrol fit score: ' + s + '/100">' + g + '</span>';
}

function cardHtml(j, mode) {
  const isNew = j.status === 'new' && !seen.includes(j.id);
  const badge = mode === 'caught' ? '<span class="badge applied">Caught</span>'
              : mode === 'interview' ? '<span class="badge applied">Interview</span>'
              : mode === 'dismissed' ? '<span class="badge dead">Released</span>'
              : isNew ? '<span class="badge new">Fresh</span>' : '';
  let actions = '';
  if (mode === 'hunt') {
    actions = `<a class="btn btn-apply" href="${j.link}" target="_blank" rel="noopener">Strike →</a>
      <button class="btn btn-mark" onclick="markCaught('${j.id}')">Mark caught</button>
      <button class="btn btn-dismiss" onclick="dismiss('${j.id}')" title="Not interested">✕</button>`;
  } else if (mode === 'caught') {
    actions = `<a class="btn btn-apply" href="${j.link}" target="_blank" rel="noopener">View posting →</a>
      <button class="btn btn-mark" onclick="markInterview('${j.id}')">Interview 📞</button>
      <button class="btn btn-restore" onclick="restore('${j.id}')">Back to hunt</button>`;
  } else if (mode === 'interview') {
    actions = `<a class="btn btn-apply" href="${j.link}" target="_blank" rel="noopener">View posting →</a>
      <button class="btn btn-restore" onclick="unInterview('${j.id}')">Back to caught</button>`;
  } else {
    actions = `<button class="btn btn-restore" style="flex:1" onclick="restore('${j.id}')">Throw back in the water</button>
      <button class="btn btn-dismiss" onclick="deleteForever('${j.id}')" title="Delete permanently">🗑</button>`;
  }
  const caughtLine = mode === 'caught' ? `<span>Caught ${applied[j.id] || ''}</span>`
    : mode === 'interview' ? `<span>Caught ${applied[j.id] || ''}</span><span>Interview ${interview[j.id] || ''}</span>` : '';
  return `<div class="card ${mode === 'hunt' && isNew ? 'fresh' : ''}">
    <div class="card-top">
      <div><h2>${j.title}</h2><div class="company">${j.company}</div></div>
      <div class="badges">${gradeChip(j)}${badge}</div>
    </div>
    <div class="meta"><span>📍 ${j.location}</span><span class="pay">${j.pay}</span><span>Added ${j.added}</span>${caughtLine}</div>
    <div class="fit">${j.fit}</div>
    <div class="actions">${actions}</div>
  </div>`;
}

function render() {
  const hunting = allJobs.filter(j => !(j.id in applied) && !dismissed.includes(j.id));
  const caught = allJobs.filter(j => (j.id in applied) && !(j.id in interview));
  const interviewing = allJobs.filter(j => j.id in interview);
  const released = allJobs.filter(j => dismissed.includes(j.id));

  $('#c-hunt').textContent = hunting.length;
  $('#c-caught').textContent = caught.length;
  $('#c-interview').textContent = interviewing.length;
  $('#c-dismissed').textContent = released.length;


  if (!authChecked) {
    $('#jobs').innerHTML = '<div id="empty">Checking sign-in…</div>';
    return;
  }
  if (!user) {
    $('#c-hunt').textContent = 0;
    $('#c-caught').textContent = 0;
    $('#c-interview').textContent = 0;
    $('#c-dismissed').textContent = 0;
    $('#jobs').innerHTML = '<div id="empty">These waters are private.<br>Sign in with Google above to see your hunt.</div>';
    return;
  }

  let html = '';
  if (tab === 'hunt') {
    const list = [...hunting].sort((a, b) => (b.score || 0) - (a.score || 0));
    html = list.length ? list.map(j => cardHtml(j, 'hunt')).join('')
      : '<div id="empty">Quiet waters here.<br>Fresh catches surface after the daily 2 PM patrol.</div>';
    seen = [...new Set([...seen, ...list.map(j => j.id)])];
  } else if (tab === 'caught') {
    html = caught.length ? caught.map(j => cardHtml(j, 'caught')).join('')
      : '<div id="empty">Nothing caught yet.<br>Hit a posting, apply, then tap Mark caught.</div>';
  } else if (tab === 'interview') {
    html = interviewing.length ? interviewing.map(j => cardHtml(j, 'interview')).join('')
      : '<div id="empty">No interviews yet.<br>When a caught job calls back, tap "Interview" on its card.</div>';
  } else {
    html = released.length
      ? `<div id="clear-bar"><span>${released.length} release${released.length === 1 ? '' : 's'} in the bin</span><button onclick="clearReleased()">Clear all 🗑</button></div>`
        + released.map(j => cardHtml(j, 'dismissed')).join('')
      : '<div id="empty">No releases.<br>Jobs you dismiss with ✕ wash up here.</div>';
  }
  $('#jobs').innerHTML = html;
  persistLocal();
}

function syncJobs() {
  // scrub deleted listings from the account's stored payload, not just the screen
  if (user && db && stateReady && lastJobsUpdated !== null) {
    db.collection('users').doc(user.uid).set({
      jobs: JSON.stringify({ updated: lastJobsUpdated, jobs: allJobs })
    }, { merge: true }).catch(e => console.warn('jobs sync failed', e));
  }
}

function markCaught(id) {
  delete removed[id];
  applied[id] = new Date().toISOString().slice(0, 10);
  save();
  toast('Caught — nice strike!');
  render();
}
function markInterview(id) {
  delete removedI[id];
  interview[id] = new Date().toISOString().slice(0, 10);
  save();
  toast('Interview — bring it home!');
  render();
}
function unInterview(id) {
  removedI[id] = new Date().toISOString();
  delete interview[id];
  persistLocal();
  render();
  save();
}
function dismiss(id) {
  delete interview[id];
  dismissed.push(id);
  save();
  toast('Released back into the water');
  render();
}
function deleteForever(id) {
  if (!confirm('Delete this posting permanently? It will not come back, even in Released.')) return;
  dismissed = dismissed.filter(x => x !== id);
  deleted.push(id);
  allJobs = allJobs.filter(j => j.id !== id);
  save();
  syncJobs();
  toast('Deleted for good');
  render();
}
function clearReleased() {
  if (!dismissed.length) return;
  if (!confirm('Clear the entire Released bin? All ' + dismissed.length + ' posting(s) will be permanently deleted and will not come back.')) return;
  deleted = [...new Set([...deleted, ...dismissed])];
  allJobs = allJobs.filter(j => !dismissed.includes(j.id));
  dismissed = [];
  save();
  syncJobs();
  toast('Released bin cleared');
  render();
}
function restore(id) {
  normalizeState();
  removed[id] = new Date().toISOString();   // tombstone: this removal must stick
  delete applied[id];
  dismissed = dismissed.filter(x => x !== id);
  persistLocal();
  render();            // respond instantly, sync in the background
  save();
  toast('Back in the hunt');
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2500);
}

document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  tab = t.dataset.tab;
  render();
});

// ---------- PWA + Push ----------
let swReg = null;
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('firebase-messaging-sw.js').then(reg => {
    swReg = reg;
    reg.update(); // check for a new version right away
  });
  // when a new service worker takes control, reload to get the fresh app
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshing) return;
    refreshing = true;
    location.reload();
  });
  // check for updates every time you come back to the app
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && swReg) swReg.update();
  });
}

let pushOn = localStorage.getItem('sharq_push_off') !== '1';

function pushSupported() {
  return 'Notification' in window && 'serviceWorker' in navigator && 'PushManager' in window;
}

async function fetchAndShowToken() {
  try {
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const messaging = firebase.messaging();
    const reg = swReg || await navigator.serviceWorker.ready;
    const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
    if (token && user && db) {
      // keep the patrol's delivery address current — tokens rot when app data is cleared
      db.collection('users').doc(user.uid).set({
        fcmToken: token,
        fcmUpdatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true }).catch(e => console.warn('token sync failed', e));
    }
  } catch (e) {
    toast('Notifications unavailable on this device');
  }
}

// silently keep the token alive for users who already said yes
if (pushSupported() && Notification.permission === 'granted' && pushOn) {
  fetchAndShowToken();
}

// ---------- Auth + Firestore sync ----------
function esc(s) { return String(s).replace(/[<>&"']/g, ''); }

function renderAccount() {
  if (user) {
    $('#acct-who').textContent = 'Signed in as ' + esc(user.displayName || user.email || 'you') + ' — devices synced';
    $('#btn-auth').textContent = 'Sign out';
    $('#btn-account').classList.add('signed');
    if (user.photoURL) {
      $('#btn-account').innerHTML = '<img src="' + esc(user.photoURL) + '" alt="">';
    } else {
      const initial = esc((user.displayName || user.email || '?').trim().charAt(0).toUpperCase());
      $('#btn-account').innerHTML = '<span class="initial">' + initial + '</span>';
    }
  } else {
    $('#acct-who').textContent = 'Not signed in — sign in to open your waters';
    $('#btn-auth').textContent = 'Sign in with Google';
    $('#btn-account').classList.remove('signed');
    $('#btn-account').innerHTML = '&#128100;';
  }
  const t = $('#btn-push-toggle');
  if (!pushSupported()) {
    t.textContent = 'N/A'; t.disabled = true;
  } else if (Notification.permission === 'denied') {
    t.textContent = 'BLOCKED'; t.disabled = true;
  } else {
    t.disabled = false;
    t.textContent = pushOn ? 'ON' : 'OFF';
    t.classList.toggle('on', pushOn);
  }
}

$('#btn-account').onclick = e => {
  e.stopPropagation();
  renderAccount();
  $('#account-panel').classList.toggle('open');
};
document.addEventListener('click', e => {
  if (!e.target.closest('#account-panel') && !e.target.closest('#btn-account')) {
    $('#account-panel').classList.remove('open');
  }
});
$('#btn-auth').onclick = () => {
  $('#account-panel').classList.remove('open');
  if (user) {
    firebase.auth().signOut();
  } else {
    firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider())
      .catch(e => toast('Sign-in failed: ' + esc(e.code || 'unknown')));
  }
};
$('#btn-push-toggle').onclick = async () => {
  if (pushOn) {
    pushOn = false;
    localStorage.setItem('sharq_push_off', '1');
    try { await firebase.messaging().deleteToken(); } catch (e) {}
    toast('Push alerts off');
  } else {
    pushOn = true;
    localStorage.removeItem('sharq_push_off');
    fetchAndShowToken();
  }
  renderAccount();
};

function initAuth() {
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  firebase.auth().onAuthStateChanged(async u => {
    user = u;
    renderAccount();
    authChecked = true;
    render();
    if (!u) { load(); return; }
    // re-save the push token on every signed-in open — tokens rot silently
    if (pushSupported() && Notification.permission === 'granted' && pushOn) fetchAndShowToken();
    const ref = db.collection('users').doc(u.uid);
    try {
      const snap = await ref.get();
      if (snap.exists) {
        const r = snap.data();
        removed = unionTombstones(removed, r.removed);
        removedI = unionTombstones(removedI, r.removedI);
        applied = withoutTombstones(Object.assign({}, asMap(r.applied), applied), removed);
        interview = withoutTombstones(Object.assign({}, asMap(r.interview), interview), removedI);
        dismissed = [...new Set([...asList(r.dismissed), ...dismissed])];
        deleted = [...new Set([...asList(r.deleted), ...deleted])];
        seen = [...new Set([...asList(r.seen), ...seen])];
        normalizeState();
        stateReady = true;
        save();
        load();
        toast('Synced across your devices');
      } else {
        stateReady = true;
        save();
        toast('Account linked — state uploaded');
      }
      ref.onSnapshot(s => {
        if (!s.exists || !user) return;
        const r = s.data();
        const rApplied = withoutTombstones(r.applied, unionTombstones(removed, r.removed));
        const rInterview = withoutTombstones(r.interview, unionTombstones(removedI, r.removedI));
        const same = JSON.stringify(rApplied) === JSON.stringify(applied)
          && JSON.stringify(rInterview) === JSON.stringify(interview)
          && JSON.stringify(asList(r.dismissed)) === JSON.stringify(dismissed)
          && JSON.stringify(asList(r.deleted)) === JSON.stringify(deleted)
          && JSON.stringify(asList(r.seen)) === JSON.stringify(seen);
        if (same) return;
        applyingRemote = true;
        removed = unionTombstones(removed, r.removed);
        removedI = unionTombstones(removedI, r.removedI);
        applied = withoutTombstones(r.applied, removed);
        interview = withoutTombstones(r.interview, removedI);
        dismissed = asList(r.dismissed);
        deleted = asList(r.deleted);
        seen = asList(r.seen);
        allJobs = allJobs.filter(j => !deleted.includes(j.id));
        save();
        applyingRemote = false;
        render();
      }, e => console.warn('sync listener error', e));
    } catch (e) {
      console.warn('Firestore unavailable, staying local', e);
      toast('Sync unavailable — using local storage');
    }
  });
}
initAuth();
renderAccount();
</script>
</body>
</html>
